<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOMPSIA | Premium Leather Goods</title>
  <meta name="description" content="KOMPSIA premium leather goods: shoes, belts, bags, wallets and refined accessories crafted for everyday elegance." />
  <meta name="theme-color" content="#161D2E" />
  <meta property="og:title" content="KOMPSIA | Premium Leather Goods" />
  <meta property="og:description" content="Premium leather goods for the discerning. Crafted with care, built to last." />
  <meta property="og:type" content="website" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    :root {
      --bg: #161D2E;
      --bgAlt: #1A2235;
      --bgHero: #1E2840;
      --card: #1E2840;
      --cardHov: #243050;
      --surface: #131A29;
      --border: rgba(255,255,255,0.07);
      --borderHov: rgba(232,98,26,0.50);
      --text: #FFFFFF;
      --muted: #8896B3;
      --sub: #4A5A7A;
      --accent: #E8621A;
      --accentH: #FF7535;
      --amber: #F5A623;
      --suc: #10B981;
      --err: #EF4444;
      --warn: #F59E0B;
      --shadow: rgba(0,0,0,0.40);
      --shadowHov: rgba(0,0,0,0.60);
      --heroRight: radial-gradient(ellipse at 40% 55%, rgba(180,72,14,0.90) 0%, rgba(110,38,10,0.92) 42%, rgba(22,29,46,1) 100%);
      --navBg: rgba(22,29,46,0.98);
      --inputBg: rgba(255,255,255,0.05);
      --drawerBg: #131A29;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-33.333%); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .opening-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1100;
      height: 36px;
      background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--amber) 80%, transparent), var(--accent));
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .marquee-track {
      animation: marquee 30s linear infinite;
      display: flex;
      white-space: nowrap;
    }
    .marquee-track span {
      color: rgba(255,255,255,0.96);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      padding-right: 80px;
    }

    .navbar {
      position: fixed;
      top: 36px;
      left: 0;
      right: 0;
      z-index: 1000;
      min-height: 66px;
      background: var(--navBg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 32px;
      transition: box-shadow 0.3s;
      backdrop-filter: blur(16px);
    }
    .navbar.scrolled { box-shadow: 0 2px 16px var(--shadow); }
    .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; cursor: pointer; }
    .logo-box { width: 40px; height: 40px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); background: var(--card); }
    .brand-name { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: 5px; font-family: Georgia, serif; }
    .nav-links { display: flex; gap: 2px; align-items: center; }
    .nav-link {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 7px;
      transition: all 0.18s;
      letter-spacing: 0.3px;
    }
    .nav-link:hover, .nav-link.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 700; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .search-wrap { position: relative; }
    .search-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 14px; }
    .search-input { width: 190px; padding-left: 36px !important; font-size: 13px !important; }

    .page { padding-top: 102px; background: var(--bg); min-height: 70vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
    .section { padding: 64px 40px; background: var(--bg); }
    .section.alt { background: var(--bgAlt); }
    .eyebrow { color: var(--accent); font-size: 11px; letter-spacing: 4px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; }
    .serif { font-family: Georgia, serif; }
    .condensed { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; }
    .muted { color: var(--muted); }
    .accent { color: var(--accent); }

    .btn, .btn-ghost {
      border-radius: 8px;
      padding: 12px 26px;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accentH));
      color: #fff;
      border: 0;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--accent); border-color: var(--borderHov); background: color-mix(in srgb, var(--accent) 8%, transparent); }

    .input, select.input, textarea.input {
      background: var(--inputBg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input:focus { border-color: var(--accent); }
    .input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
    select.input option { color: #111; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 12px var(--shadow);
      transition: all 0.22s ease;
    }
    .card-hover { cursor: pointer; overflow: hidden; position: relative; }
    .card-hover:hover {
      background: var(--cardHov);
      border-color: var(--borderHov);
      box-shadow: 0 8px 28px var(--shadowHov);
      transform: translateY(-5px);
    }

    .hero {
      min-height: calc(100vh - 102px);
      display: flex;
      background: var(--bg);
    }
    .hero-left {
      flex: 1;
      padding: 90px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bgAlt) 100%);
    }
    .hero-right {
      width: 46%;
      background: var(--heroRight);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero-k {
      position: absolute;
      font-size: min(60vw, 520px);
      font-weight: 900;
      color: rgba(255,255,255,0.045);
      font-family: Georgia, serif;
      line-height: 0.85;
      right: -8%;
      bottom: -8%;
      user-select: none;
    }
    .hero-title {
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-size: clamp(52px, 8vw, 120px);
      font-weight: 900;
      line-height: 0.86;
      text-transform: uppercase;
      letter-spacing: -2px;
      color: var(--text);
      margin: 0 0 24px;
    }
    .hero-copy {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      max-width: 520px;
      margin: 0 0 34px;
    }
    .hero-logo {
      z-index: 2;
      text-align: center;
    }
    .hero-logo .logo-big {
      width: 150px;
      height: 150px;
      border-radius: 24px;
      overflow: hidden;
      margin: 0 auto 22px;
      box-shadow: 0 12px 60px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.15);
    }
    .hero-logo .logo-text {
      color: rgba(255,255,255,0.78);
      font-size: 16px;
      letter-spacing: 8px;
      font-weight: 700;
      font-family: Georgia, serif;
    }
    .stat-row { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 38px; }
    .stat .num { color: var(--accent); font-size: 26px; font-weight: 800; font-family: Georgia, serif; }
    .stat .label { color: var(--muted); font-size: 12px; margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }

    .grid { display: grid; gap: 22px; }
    .grid.products { grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); }
    .grid.categories { grid-template-columns: repeat(4, 1fr); }
    .grid.features { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }

    .category-card { height: 280px; position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; background: var(--card); }
    .category-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.45s; opacity: 0.78; }
    .category-card:hover img { transform: scale(1.06); }
    .category-card::after { content:""; position:absolute; inset:0; background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0.10)); }
    .category-card .cat-content { position: absolute; bottom: 22px; left: 22px; right: 22px; z-index: 2; color: #fff; }
    .category-card h3 { margin: 0 0 6px; font-family: Georgia, serif; font-size: 24px; }
    .category-card p { margin: 0; color: rgba(255,255,255,0.78); font-size: 13px; }

    .product-card { position: relative; }
    .product-img { height: 216px; overflow: hidden; position: relative; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.45s; }
    .product-card:hover .product-img img { transform: scale(1.06); }
    .product-img::after { content:""; position:absolute; inset:0; background: linear-gradient(to bottom, transparent 50%, color-mix(in srgb, var(--card) 86%, transparent) 100%); }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 3;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.4px;
    }
    .stock-badge {
      position:absolute;
      top:12px;
      right:12px;
      z-index:3;
      background: var(--card);
      color: var(--muted);
      font-size:11px;
      font-weight:700;
      padding:4px 12px;
      border-radius:20px;
      border:1px solid var(--border);
    }
    .product-info { padding: 16px 18px 20px; }
    .product-cat { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 5px; }
    .product-title { color: var(--text); font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .rating { color: var(--amber); font-size: 13px; letter-spacing: 1px; }
    .price-row { display: flex; align-items: baseline; gap: 9px; margin-top: 12px; }
    .price { color: var(--accent); font-weight: 800; font-size: 20px; }
    .orig { color: var(--muted); text-decoration: line-through; font-size: 14px; }

    .drawer-backdrop, .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 2000;
      animation: fadeIn 0.18s;
    }
    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 430px;
      max-width: 100%;
      background: var(--drawerBg);
      z-index: 2001;
      border-left: 1px solid var(--border);
      box-shadow: -12px 0 40px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
    }
    .drawer-head, .drawer-foot { padding: 20px 22px; border-bottom: 1px solid var(--border); }
    .drawer-foot { border-top: 1px solid var(--border); border-bottom: 0; }
    .drawer-body { flex: 1; overflow: auto; padding: 20px 22px; }
    .cart-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .cart-thumb { width: 72px; height: 72px; border-radius: 9px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
    .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-controls button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text); }

    .modal {
      position: fixed;
      z-index: 2002;
      top: 50%;
      left: 50%;
      width: 420px;
      max-width: calc(100% - 36px);
      transform: translate(-50%, -50%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 70px rgba(0,0,0,0.55);
      padding: 28px;
    }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 10px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border); }
    .tab { border: 0; padding: 10px; border-radius: 8px; color: var(--muted); background: transparent; font-weight: 700; }
    .tab.active { background: var(--accent); color: #fff; }

    .checkout-grid { display: grid; grid-template-columns: 1fr 310px; gap: 28px; }
    .stepper { display: flex; align-items: center; margin-bottom: 44px; }
    .step-node { display: flex; align-items: center; gap: 10px; }
    .step-circle { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: var(--border); color: var(--muted); transition: all 0.3s; }
    .step-circle.active { background: var(--accent); color: #fff; }
    .step-circle.done { background: var(--suc); color: #fff; }
    .step-line { flex: 1; height: 1px; background: var(--border); margin: 0 14px; }
    .step-line.done { background: var(--suc); }

    .admin-layout { padding-top: 102px; display: flex; min-height: 90vh; background: var(--bg); }
    .admin-sidebar { width: 220px; background: var(--bgAlt); border-right: 1px solid var(--border); padding: 28px 0; flex-shrink: 0; position: sticky; top: 102px; height: calc(100vh - 102px); overflow: auto; }
    .admin-main { flex: 1; padding: 36px; overflow: auto; }
    .admin-nav { width: 100%; padding: 12px 20px; background: transparent; border: 0; border-left: 2px solid transparent; color: var(--muted); font-size: 14px; cursor: pointer; text-align: left; transition: all 0.15s; }
    .admin-nav.active { color: var(--accent); font-weight: 700; background: color-mix(in srgb, var(--accent) 10%, transparent); border-left-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--muted); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; color: var(--muted); border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); font-size: 14px; }

    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--toastColor, var(--suc)) 40%, transparent);
      border-left: 3px solid var(--toastColor, var(--suc));
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 28px var(--shadow);
      animation: slideUp 0.3s ease;
      max-width: 340px;
    }

    @media (max-width: 980px) {
      .navbar { padding: 10px 18px; flex-wrap: wrap; }
      .nav-links { order: 3; width: 100%; justify-content: center; }
      .nav-actions { flex-wrap: wrap; justify-content: flex-end; }
      .search-input { width: 150px; }
      .hero, .about-hero { flex-direction: column; }
      .hero-right, .about-visual { width: 100% !important; min-height: 330px; }
      .hero-left { padding: 70px 34px; }
      .grid.categories { grid-template-columns: repeat(2, 1fr); }
      .checkout-grid { grid-template-columns: 1fr; }
      .admin-layout { flex-direction: column; }
      .admin-sidebar { width: 100%; height: auto; position: static; display: flex; overflow-x: auto; padding: 14px; }
      .admin-main { padding: 24px; }
    }
    @media (max-width: 640px) {
      .brand-name { font-size: 16px; letter-spacing: 3px; }
      .navbar { top: 36px; min-height: 78px; }
      .page, .admin-layout { padding-top: 138px; }
      .section { padding: 44px 20px; }
      .container { padding: 0 20px; }
      .hero { min-height: auto; padding-top: 36px; }
      .hero-left { padding: 54px 22px; }
      .hero-title { font-size: clamp(44px, 17vw, 78px); }
      .grid.categories, .grid.features { grid-template-columns: 1fr; }
      .modal { padding: 22px; }
      .cart-drawer { width: 100%; }
      .nav-actions { width: 100%; justify-content: center; }
      .search-wrap { flex: 1; min-width: 160px; }
      .search-input { width: 100%; }
      .stepper { overflow-x: auto; }
    }
  </style>
</head>

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}
function aed(n) { return `AED ${Number(n).toLocaleString("en-AE")}`; }
function stars(r) { return "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r)); }
function T() { return THEMES[state.themeName]; }

function cartSub() { return state.cart.reduce((s, i) => s + i.price * i.qty, 0); }
function shipping() { const sub = cartSub(); return sub > 0 && sub < 500 ? 25 : 0; }
function discountAmount() { return state.coupon ? Math.round(cartSub() * state.coupon.pct / 100) : 0; }
function cartTotal() { return cartSub() - discountAmount() + shipping(); }
function cartCount() { return state.cart.reduce((s, i) => s + i.qty, 0); }
function filteredProducts() {
  const q = state.search.trim().toLowerCase();
  return state.products.filter(p => (state.catFilter === "all" || p.cat === state.catFilter) && (!q || p.name.toLowerCase().includes(q)));
}
function relatedProducts(product) {
  return state.products.filter(p => p.cat === product.cat && p.id !== product.id).slice(0, 4);
}
function setState(patch) { Object.assign(state, patch); render(); }
function nav(page, cat) {
  if (cat) state.catFilter = cat;

function notify(msg, type = "success") {

  notify._timer = window.setTimeout(() => { state.toast = null; render(); }, 3500);
}
function applyTheme() {
  const theme = T();
  for (const [key, value] of Object.entries(theme)) {
    if (typeof value === "string") document.documentElement.style.setProperty(`--${key}`, value);
  }
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme.bg);
}
function badgeColor(badge) {
  if (badge === "Bestseller") return "var(--accent)";
  if (badge === "New") return "#7C3AED";
  if (badge === "Limited") return "var(--amber)";
  return "var(--accent)";
}
function imgFor(product) { return IMGS[product.img] || IMGS.shoes_1; }
function addToCart(id) {
  const p = state.products.find(item => item.id === id);
  if (!p) return;
  if (p.stock === 0) { notify("Out of stock", "error"); return; }
  const existing = state.cart.find(item => item.id === id);
  if (existing) existing.qty += 1;
  else state.cart.push({ ...p, qty: 1 });
  state.cartOpen = true;
  notify(`${p.name} added!`);
}
function updateQty(id, qty) {
  qty = Number(qty);
  if (qty < 1) state.cart = state.cart.filter(item => item.id !== id);
  else state.cart = state.cart.map(item => item.id === id ? { ...item, qty } : item);
  render();
}
function removeFromCart(id) { state.cart = state.cart.filter(item => item.id !== id); render(); }
function applyCoupon() {
  const c = COUPONS[state.couponInput.trim().toUpperCase()];
  if (c) { state.coupon = c; notify(`Applied: ${c.label}!`); }
  else notify("Invalid code", "error");
}

function handleLogin() {
  const { name, email, pass } = state.loginForm;
  if (!email || !pass) { notify("Fill all fields", "error"); return; }
  if (email === "admin@kompsia.com" && pass === "admin123") {
    state.user = { name: "Admin", email, role: "admin" };
    state.isAdmin = true;
    state.loginOpen = false;
    state.page = "admin";
    notify("Welcome, Admin!");
  } else {
    state.user = { name: name || email.split("@")[0], email, role: "customer" };
    state.isAdmin = false;
    state.loginOpen = false;
    notify("Welcome back!");
  }
}
function handleRegister() {
  const { name, email, pass } = state.loginForm;
  if (!name || !email || !pass) { notify("Fill all fields", "error"); return; }
  state.user = { name, email, role: "customer" };
  state.isAdmin = false;
  state.loginOpen = false;
  notify(`Welcome, ${name}!`);
}
function placeOrder() {
  if (!state.user) { state.cartOpen = false; state.loginOpen = true; render(); return; }
  if (!state.form.address) { notify("Enter delivery address", "error"); return; }
  if (state.cart.length === 0) { notify("Your cart is empty", "error"); return; }
  const o = {
    id: `KMP-${Date.now().toString().slice(-6)}`,
    date: new Date().toLocaleDateString("en-AE", { day:"2-digit", month:"short", year:"numeric" }),
    items: state.cart.map(item => ({ ...item })),
    subtotal: cartSub(),
    discount: discountAmount(),
    shipping: shipping(),
    total: cartTotal(),
    status: "Processing",
    address: `${state.form.address}, ${state.form.city}, ${state.form.country}`,
    tracking: `TRK${Date.now().toString().slice(-8)}`,
    coupon: state.coupon?.label || null
  };
  state.orders.unshift(o);
  state.cart = [];
  state.coupon = null;
  state.couponInput = "";
  state.cartOpen = false;
  state.page = "confirmed";
  state.step = 1;
  notify(`Order ${o.id} placed!`);
}

  const outOfStock = state.products.filter(p => p.stock === 0).length;
  const lowStock = state.products.filter(p => p.stock > 0 && p.stock <= 5).length;
  if (state.adminSection === "dashboard") return `<div><h2 class="serif" style="color:var(--text);margin:0 0 24px;font-size:28px">Dashboard</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:28px">${[["💰",aed(totalRev),"Revenue","var(--accent)"],["📦",state.orders.length,"Orders","var(--amber)"],["🏷️",state.products.length,"Products","var(--suc)"],["⚠️",outOfStock,"Out of Stock","var(--err)"],["📉",lowStock,"Low Stock","var(--warn)"],["👥",3+state.orders.length,"Customers","#3B82F6"]].map(([ic,v,l,c]) => `<div class="card" style="padding:18px"><div style="font-size:24px;margin-bottom:8px">${ic}</div><div style="color:${c};font-weight:800;font-size:24px">${v}</div><div style="color:var(--muted);font-size:12px;margin-top:3px">${l}</div></div>`).join("")}</div><div class="card" style="padding:24px"><h3 style="color:var(--text);margin:0 0 18px">Recent Orders</h3>${state.orders.length ? state.orders.slice(0,5).map(o => `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">${esc(o.id)}</span><span style="color:var(--accent);font-weight:700">${aed(o.total)}</span></div>`).join("") : `<p style="color:var(--muted)">No orders yet.</p>`}</div></div>`;
  if (state.adminSection === "products") return `<div><h2 class="serif" style="color:var(--text);font-size:28px;margin:0 0 24px">Products</h2><div class="card" style="overflow:auto"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.products.map(p => `<tr><td><div style="display:flex;align-items:center;gap:12px"><img src="${esc(imgFor(p))}" alt="" style="width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--border)"><span style="color:var(--text);font-weight:600">${esc(p.name)}</span></div></td><td style="text-transform:capitalize">${esc(p.cat)}</td><td style="color:var(--accent);font-weight:700">${aed(p.price)}</td><td><input class="input" type="number" value="${p.stock}" min="0" style="width:70px;padding:5px 8px;font-size:13px" onchange="updateProductStock(${p.id},this.value)"></td><td><span style="background:color-mix(in srgb, ${p.stock===0?"var(--err)":p.stock<=5?"var(--warn)":"var(--suc)"} 12%, transparent);color:${p.stock===0?"var(--err)":p.stock<=5?"var(--warn)":"var(--suc)"};padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600">${p.stock===0?"Out of Stock":p.stock<=5?"Low Stock":"In Stock"}</span></td><td><button class="btn-ghost" style="padding:5px 12px;font-size:12px" onclick="notify('Edit mode — connect backend to save','info')">Edit</button></td></tr>`).join("")}</tbody></table></div></div>`;
  if (state.adminSection === "analytics") return `<div><h2 class="serif" style="color:var(--text);font-size:28px;margin:0 0 24px">Analytics</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">${renderTopRated()}${renderInventoryHealth()}${renderCouponPerformance()}${renderSystemStatus()}</div></div>`;
  return `<div><h2 class="serif" style="color:var(--text);font-size:28px;margin:0 0 24px">Settings</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div class="card" style="padding:26px"><h3 style="color:var(--text);font-size:16px;margin:0 0 20px">Store Information</h3><div style="display:flex;flex-direction:column;gap:14px">${[["Store Name","KOMPSIA"],["Currency","AED"],["VAT No.","TRN 123456789"],["Email","support@kompsia.com"],["Location","Dubai, UAE"]].map(([l,v]) => `<div><label style="color:var(--muted);font-size:11px;margin-bottom:6px;display:block;letter-spacing:1.5px">${l.toUpperCase()}</label><input class="input" value="${v}"></div>`).join("")}<button class="btn" style="padding:13px;margin-top:4px" onclick="notify('Settings saved!')">Save Changes</button></div></div><div class="card" style="padding:26px"><h3 style="color:var(--text);font-size:16px;margin:0 0 20px">Notifications</h3>${[["orderEmail","Order Confirmation Email"],["shippingSms","Shipping Updates SMS"],["lowStock","Low Stock Alerts"],["dailyReport","Daily Revenue Report"],["customerReg","New Customer Alert"]].map(([key,label]) => renderToggle(key,label)).join("")}</div></div></div>`;
}
function renderTopRated() { return `<div class="card" style="padding:24px"><h3 style="color:var(--text);margin:0 0 16px;font-size:15px">Top Rated Products</h3>${[...state.products].sort((a,b)=>b.rating-a.rating).slice(0,5).map(p => `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><img src="${esc(imgFor(p))}" style="width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--border)" alt=""><div style="flex:1"><div style="color:var(--text);font-size:13px;font-weight:600">${esc(p.name)}</div><div style="height:4px;background:var(--border);border-radius:2px;margin-top:5px"><div style="height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:2px;width:${(p.rating/5)*100}%"></div></div></div><span style="color:var(--accent);font-weight:700;font-size:14px">${p.rating}</span></div>`).join("")}</div>`; }
function renderInventoryHealth() { const rows = [["In Stock",state.products.filter(p=>p.stock>5).length,"var(--suc)"],["Low Stock",state.products.filter(p=>p.stock>0&&p.stock<=5).length,"var(--warn)"],["Out of Stock",state.products.filter(p=>p.stock===0).length,"var(--err)"]]; return `<div class="card" style="padding:24px"><h3 style="color:var(--text);margin:0 0 16px;font-size:15px">Inventory Health</h3>${rows.map(([l,v,c]) => `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--muted);font-size:13px">${l}</span><span style="color:${c};font-weight:700">${v}</span></div><div style="height:6px;background:var(--border);border-radius:3px"><div style="height:100%;background:${c};border-radius:3px;width:${(v/state.products.length)*100}%"></div></div></div>`).join("")}</div>`; }
function renderCouponPerformance() { return `<div class="card" style="padding:24px"><h3 style="color:var(--text);margin:0 0 16px;font-size:15px">Coupon Performance</h3>${Object.entries(COUPONS).map(([code,c]) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid color-mix(in srgb, var(--border) 50%, transparent)"><div><div style="color:var(--accent);font-weight:700;font-size:14px">${esc(code)}</div><div style="color:var(--muted);font-size:12px">${esc(c.label)}</div></div><div style="background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid color-mix(in srgb, var(--accent) 30%, transparent)">${c.pct}% OFF</div></div>`).join("")}</div>`; }
function renderSystemStatus() { return `<div class="card" style="padding:24px"><h3 style="color:var(--text);margin:0 0 16px;font-size:15px">System Status</h3>${[["Frontend","Online",true],["Cart & Checkout","Active",true],["Payment Flow","Simulated",true],["Email Alerts","Active",true],["Backend API","Connect to Deploy",false],["Database","Connect to Deploy",false]].map(([l,s,ok]) => `<div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px"><span style="color:var(--muted)">${l}</span><span style="color:${ok?"var(--suc)":"var(--warn)"};font-weight:600">${ok?"●":"○"} ${s}</span></div>`).join("")}</div>`; }
function renderToggle(key,label) { const checked = state.notifSettings[key]; return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb, var(--border) 50%, transparent)"><span style="color:var(--muted);font-size:14px">${label}</span><button aria-label="${label}" onclick="toggleNotification('${key}')" style="width:44px;height:24px;background:${checked?"var(--accent)":"rgba(128,128,128,0.25)"};border-radius:12px;cursor:pointer;position:relative;transition:background 0.25s;border:1px solid ${checked?"var(--accent)":"var(--border)"}"><span style="position:absolute;top:2px;left:${checked?21:2}px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left 0.25s;box-shadow:0 1px 4px rgba(0,0,0,0.3)"></span></button></div>`; }
function renderPolicy() {
  const items = [
    ["🔐 Privacy Policy","We collect only what is necessary: name, email, phone, address, and payment info. Data is never sold. SSL-encrypted, PCI-DSS compliant payments. Contact privacy@kompsia.com to exercise data rights."],
    ["📦 Returns & Refunds","30-day returns for unused items in original packaging. Email support@kompsia.com with your order ID. Refunds in 5–7 business days. Return shipping is your responsibility unless item is defective."],
    ["🚚 Shipping Policy","UAE delivery 3–5 business days. Express 1–2 days. Same-day in Dubai. Free standard shipping on orders over AED 500. GCC countries: 4–7 business days."],
    ["⚖️ Terms & Conditions","By using KOMPSIA, you agree to these terms. Prices in AED inclusive of 5% VAT. All IP belongs to KOMPSIA. Governed by UAE law. Disputes resolved in Dubai courts."],
    ["🍪 Cookie Policy","We use essential, analytics, and marketing cookies. Disable non-essential cookies in your browser without affecting core functionality."]
  ];
  return `<main class="page"><div style="padding:48px 40px 36px;background:var(--bgAlt);border-bottom:1px solid var(--border)"><div class="container"><div class="eyebrow">Legal</div><h1 class="serif" style="color:var(--text);font-size:36px;margin:0">Policies & Legal</h1></div></div><div class="container" style="max-width:860px;padding-top:40px;padding-bottom:40px">${items.map(([title,content]) => `<section class="card" style="padding:28px;margin-bottom:16px"><h2 style="color:var(--text);font-size:18px;margin:0 0 14px;font-weight:700">${title}</h2><p style="color:var(--muted);line-height:1.85;font-size:14px;margin:0">${content}</p></section>`).join("")}<div class="card" style="padding:28px;background:var(--surface);border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);margin-top:4px"><h3 style="color:var(--text);margin:0 0 12px;font-size:17px">📲 Mobile App — Coming Soon</h3><p style="color:var(--muted);font-size:14px;margin:0 0 18px">Shop on the go. Coming to iOS and Android.</p><div style="display:flex;gap:12px"><button class="btn-ghost" style="padding:11px 22px" onclick="notify('iOS App — Coming Soon!','info')">🍎 App Store</button><button class="btn-ghost" style="padding:11px 22px" onclick="notify('Android App — Coming Soon!','info')">🤖 Google Play</button></div></div></div></main>`;
}
function renderAbout() {
  return `<main class="page"><section class="hero about-hero" style="min-height:55vh"><div style="flex:1;background:var(--bgAlt);padding:80px 64px;display:flex;flex-direction:column;justify-content:center"><div class="eyebrow">Our Story</div><h1 class="condensed" style="font-size:clamp(42px,6vw,80px);font-weight:900;line-height:0.95;text-transform:uppercase;letter-spacing:-1px;color:var(--text);margin:0 0 24px">CRAFTED<br>WITH<br>PURPOSE</h1><p style="color:var(--muted);font-size:17px;line-height:1.75;max-width:380px;margin:0">Born from the belief that everyday objects should be extraordinary. Every KOMPSIA piece tells a story of craftsmanship.</p></div><div class="about-visual" style="width:42%;background:var(--heroRight);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0"><div class="hero-k">K</div><div style="z-index:2;text-align:center"><div style="width:96px;height:96px;border-radius:18px;overflow:hidden;margin:0 auto 16px;box-shadow:0 8px 40px rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.15)"><img src="${logoSrc}" alt="KOMPSIA logo"></div><div style="color:rgba(255,255,255,0.75);font-size:14px;letter-spacing:6px;font-weight:700;font-family:Georgia,serif">KOMPSIA</div></div></div></section>
  <div class="container" style="max-width:1040px;padding-top:64px;padding-bottom:64px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:52px;margin-bottom:56px"><div><h2 class="serif" style="color:var(--text);font-size:28px;margin:0 0 20px">The Philosophy</h2>${["The name KOMPSIA comes from the Greek Κομψία — elegance and refinement. It's not just a brand; it's a commitment to craftsmanship that endures.","Based in Dubai, we source the finest full-grain leathers from Italian tanneries with decades of heritage. Every product is rigorously quality-inspected.","Our collection is built on the belief that true luxury is defined by quality and longevity — not just price."].map(text => `<p style="color:var(--muted);line-height:1.85;margin:0 0 14px;font-size:15px">${esc(text)}</p>`).join("")}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start">${[["📧","Email","support@kompsia.com"],["📱","WhatsApp","+971 50 XXX XXXX"],["📍","Location","Dubai, UAE"],["⏰","Hours","Mon–Sat · 9am–7pm"]].map(([ic,l,v]) => `<div class="card" style="padding:20px;text-align:center"><div style="font-size:28px;margin-bottom:10px">${ic}</div><div style="color:var(--muted);font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">${l}</div><div style="color:var(--text);font-weight:600;font-size:13px">${v}</div></div>`).join("")}</div></div><div class="card" style="padding:32px"><h3 class="serif" style="color:var(--text);margin:0 0 20px;font-size:20px">Send a Message</h3><div style="display:flex;flex-direction:column;gap:13px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:13px"><input class="input" placeholder="Your Name"><input class="input" placeholder="Email"></div><input class="input" placeholder="Subject"><textarea class="input" placeholder="Your message..." style="height:110px;resize:vertical"></textarea><button class="btn" style="padding:13px;font-size:15px;border-radius:9px" onclick="notify('Message sent! We\\'ll reply within 24 hours.')">Send Message</button></div></div></div></main>`;
}
function renderFooter() {
  if (state.page === "admin") return "";
  const groups = [
    ["Shop",[["Shoes","catalog","shoes"],["Belts","catalog","belts"],["Bags","catalog","bags"],["Wallets","catalog","wallets"]]],
    ["Company",[["About","about",null],["Contact","about",null],["Privacy","policy",null],["Terms","policy",null]]],
    ["Support",[["My Orders","orders",null],["Returns","policy",null],["Shipping","policy",null],["FAQ","about",null]]]
  ];
  return `<footer style="border-top:1px solid var(--border);padding:56px 40px 28px;background:var(--bgAlt)"><div class="container"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:36px;margin-bottom:48px"><div><div class="brand" style="margin-bottom:16px" onclick="nav('home')"><div class="logo-box" style="width:36px;height:36px;border-radius:8px"><img src="${logoSrc}" alt="KOMPSIA logo"></div><span class="brand-name" style="font-size:18px;letter-spacing:4px">KOMPSIA</span></div><p style="color:var(--muted);font-size:13px;line-height:1.85;margin:0">Premium leather goods for the discerning. Crafted with care, built to last a lifetime.</p></div>${groups.map(([title,links]) => `<div><h4 style="color:var(--text);font-weight:700;margin:0 0 16px;font-size:12px;letter-spacing:3px;text-transform:uppercase">${title}</h4>${links.map(([l,p,c]) => `<button style="display:block;background:transparent;border:0;padding:0;color:var(--muted);font-size:13px;margin-bottom:10px;cursor:pointer" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'" onclick="nav('${p}'${c?`, '${c}'`:""})">${l}</button>`).join("")}</div>`).join("")}</div><div style="border-top:1px solid var(--border);padding-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px"><span style="color:var(--muted);font-size:12px">© 2026 KOMPSIA · Dubai, UAE · TRN 123456789012345</span><div style="display:flex;gap:16px;flex-wrap:wrap">${["Visa","Mastercard","Amex","Apple Pay","Google Pay"].map(p => `<span style="color:var(--muted);font-size:11px;opacity:0.7">${p}</span>`).join("")}</div></div></div></footer>`;
}
function renderToast() {
  if (!state.toast) return "";
  const color = { success:"var(--suc)", error:"var(--err)", info:"var(--amber)", warning:"var(--warn)" }[state.toast.type] || "var(--suc)";
  const icon = state.toast.type === "success" ? "✓" : state.toast.type === "error" ? "✕" : "ℹ";
  return `<div class="toast" style="--toastColor:${color}"><span style="color:${color};font-size:18px;font-weight:700">${icon}</span><span style="color:var(--text);font-weight:600;font-size:14px">${esc(state.toast.msg)}</span></div>`;
}
function renderMainPage() {
  if (state.page === "home") return renderHome();
  if (state.page === "catalog") return renderCatalog();
  if (state.page === "product") return renderProductPage();
  if (state.page === "checkout" || state.page === "confirmed") return renderCheckout();
  if (state.page === "orders") return renderOrders();
  if (state.page === "admin") return renderAdmin();
  if (state.page === "policy") return renderPolicy();
  if (state.page === "about") return renderAbout();
  return renderHome();
}
function render() {
  applyTheme();
  app.innerHTML = [
    renderBanner(),
    renderNavbar(),
    renderMainPage(),
    renderFooter(),
    renderCartDrawer(),
    renderLoginModal(),
    renderToast()
  ].join("");
}
window.addEventListener("scroll", () => {
  const next = window.scrollY > 10;
  if (next !== state.scrolled) { state.scrolled = next; render(); }
}, { passive: true });
document.title = "KOMPSIA | Premium Leather Goods";
const icon = document.createElement("link");
icon.rel = "icon";
icon.type = "image/jpeg";
icon.href = logoSrc;
document.head.appendChild(icon);
render();
  </script>
</body>
</html>
