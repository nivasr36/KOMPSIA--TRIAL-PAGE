@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --font-display:'Space Grotesk','Inter',sans-serif;
  --font-body:'Inter','Helvetica Neue',Arial,sans-serif;
  --header-edge:110px;
  --page-start:152px;

  /* Navy / Orange / Black — glass dark mode */
  --bg:#070911; --bgAlt:rgba(255,255,255,0.035); --bgHero:#0C0F1B;
  --card:rgba(255,255,255,0.045); --cardHov:rgba(255,255,255,0.075); --surface:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.10); --borderHov:rgba(255,138,61,0.55);
  --text:#F3F5FA; --muted:#8D96B8; --sub:#4A5175;
  --accent:#FF8A3D; --accentH:#FFA35F; --navy:#3D5AA8; --navyL:#5B7BD1; --amber:#FF8A3D;
  --suc:#3FAE84; --err:#E15B4D; --warn:#F0A73C;
  --shadow:rgba(0,0,0,0.45); --shadowHov:rgba(0,0,0,0.6);
  --glass-blur: blur(22px);
  --glass-border: rgba(255,255,255,0.12);
  --glass-sheen: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 60%);
  --heroRight: radial-gradient(ellipse at 35% 45%, rgba(61,90,168,0.55) 0%, rgba(255,138,61,0.18) 45%, rgba(7,9,17,0.98) 100%);
  --meshBg: radial-gradient(circle at 12% 18%, rgba(61,90,168,0.35) 0%, transparent 40%), radial-gradient(circle at 85% 15%, rgba(255,138,61,0.28) 0%, transparent 42%), radial-gradient(circle at 30% 85%, rgba(61,90,168,0.30) 0%, transparent 45%), radial-gradient(circle at 90% 80%, rgba(255,138,61,0.20) 0%, transparent 40%);
  --navBg: rgba(7,9,17,0.55);
  --inputBg: rgba(255,255,255,0.05);
  --drawerBg:rgba(10,13,23,0.75);
  --placeholder-color: rgba(141,150,184,0.55);
  --scrollbar-thumb: rgba(255,138,61,0.4);
  --focus-shadow: 0 0 0 3px rgba(255,138,61,0.18);
  --new-badge:#5B7BD1;
  --accent-tint: rgba(255,138,61,0.14);
  --accent-tint-border: rgba(255,138,61,0.4);
  --badge-bg: rgba(6,8,14,0.82); --badge-solid: #0B0E17;
  --badge-text: #F3F5FA;
  --blend-surface: rgba(255,255,255,0.07);
  --blend-surface-focus: rgba(255,255,255,0.11);
}
html.light body{
  /* Matte olive green / beige — glass light mode */
  --bg:#EDE8D9; --bgAlt:rgba(255,255,255,0.55); --bgHero:#E3DCC6;
  --card:rgba(255,255,255,0.88); --cardHov:rgba(255,255,255,0.97); --surface:rgba(255,255,255,0.62);
  --border:rgba(74,86,50,0.18); --borderHov:rgba(94,110,63,0.55);
  --text:#211F17; --muted:#544F3D; --sub:#A39D82;
  --accent:#5E6E3F; --accentH:#728249; --navy:#4A5A80; --navyL:#63739C; --amber:#8A6E35;
  --suc:#4C7A5C; --err:#9B4438; --warn:#8A6E35;
  --shadow:rgba(60,55,30,0.10); --shadowHov:rgba(60,55,30,0.18);
  --glass-blur: blur(18px);
  --glass-border: rgba(94,110,63,0.20);
  --glass-sheen: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 60%);
  --heroRight: radial-gradient(ellipse at 35% 45%, rgba(94,110,63,0.42) 0%, rgba(138,110,53,0.20) 45%, rgba(46,44,34,0.94) 100%);
  --meshBg: radial-gradient(circle at 12% 18%, rgba(94,110,63,0.22) 0%, transparent 42%), radial-gradient(circle at 85% 15%, rgba(138,110,53,0.18) 0%, transparent 42%), radial-gradient(circle at 30% 85%, rgba(94,110,63,0.20) 0%, transparent 45%), radial-gradient(circle at 90% 80%, rgba(199,188,150,0.30) 0%, transparent 40%);
  --navBg: rgba(237,232,217,0.55);
  --inputBg: rgba(255,255,255,0.55);
  --drawerBg:rgba(240,236,224,0.80);
  --placeholder-color: rgba(110,106,84,0.55);
  --scrollbar-thumb: rgba(94,110,63,0.35);
  --focus-shadow: 0 0 0 3px rgba(94,110,63,0.16);
  --new-badge:#4A5A80;
  --accent-tint: rgba(94,110,63,0.12);
  --accent-tint-border: rgba(94,110,63,0.35);
  --badge-bg: rgba(255,253,247,0.92);
  --badge-solid: #FDFBF5;
  --badge-text: #2C2B22;
  --blend-surface: rgba(30,26,14,0.09);
  --blend-surface-focus: rgba(30,26,14,0.14);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;overflow-x:hidden;}
body{
  background-color:var(--bg); color:var(--text); min-height:100vh;
  font-family:var(--font-body);
  transition:background-color 0.4s ease,color 0.4s ease;
  position:relative;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--meshBg); transition:background 0.5s ease;
}
#app{ position:relative; z-index:1; }
::selection{ background:var(--accent); color:#fff; }
::placeholder{color:var(--placeholder-color);}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--accent)!important;box-shadow:var(--focus-shadow)!important;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:10px;}
select option{background:var(--bgAlt);color:var(--text);}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;}

@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-33.33%)}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-2%,3%) scale(1.05)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:scale(0.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* Reusable component classes — liquid glass */
.card{
  background:var(--card); border:1px solid var(--glass-border); border-radius:18px;
  box-shadow:0 8px 32px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  transition:all 0.3s ease; position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; inset:0; background:var(--glass-sheen); pointer-events:none;
}
.card-hov{
  background:var(--card); border:1px solid var(--glass-border); border-radius:18px;
  box-shadow:0 8px 32px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  transition:all 0.35s cubic-bezier(.2,.8,.3,1); cursor:pointer; position:relative; overflow:hidden;
}
.card-hov::before{ content:""; position:absolute; inset:0; background:var(--glass-sheen); pointer-events:none; }
.card-hov:hover{ background:var(--cardHov); border-color:var(--borderHov); box-shadow:0 20px 48px var(--shadowHov), inset 0 1px 0 rgba(255,255,255,0.10); transform:translateY(-6px); }
.btn{
  background:linear-gradient(135deg,var(--accent),var(--navy)); color:#fff; border:1px solid rgba(255,255,255,0.18); border-radius:14px;
  padding:13px 28px; font-weight:600; font-size:13.5px; cursor:pointer; letter-spacing:0.3px;
  box-shadow:0 6px 20px rgba(255,138,61,0.28), inset 0 1px 0 rgba(255,255,255,0.25); transition:all 0.25s ease; font-family:var(--font-body);
}
.btn:hover{ filter:brightness(1.1); box-shadow:0 10px 28px rgba(255,138,61,0.4), inset 0 1px 0 rgba(255,255,255,0.3); transform:translateY(-2px); }
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important;}
.btn-ghost{
  background:rgba(255,255,255,0.05); color:var(--text); border:1px solid var(--glass-border); border-radius:14px;
  padding:13px 28px; font-weight:500; font-size:13.5px; cursor:pointer; transition:all 0.25s ease; font-family:var(--font-body);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.btn-ghost:hover{ border-color:var(--accent); color:var(--accent); background:rgba(255,255,255,0.09); }
.inp{
  background:var(--inputBg); color:var(--text); border:1px solid var(--glass-border); border-radius:12px;
  padding:13px 16px; font-size:14px; width:100%; outline:none; transition:border-color 0.2s; font-family:var(--font-body);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.img-hover{ transition:transform 0.6s cubic-bezier(.16,.8,.24,1); }
.img-hover-wrap:hover .img-hover{ transform:scale(1.06); }
.link-hover{ transition:color 0.2s; }
.link-hover:hover{ color:var(--accent)!important; }
.navlink{ background:transparent;border:none;font-size:13px;cursor:pointer;padding:9px 16px;border-radius:10px;transition:all 0.2s;letter-spacing:0.2px;font-family:var(--font-body);font-weight:500; }
.navlink:hover{ background:rgba(255,255,255,0.07); }

/* Blended nav elements — no outlines, seamless with navbar surface */
.blend-inp{
  background:var(--blend-surface); color:var(--text); border:1px solid transparent; border-radius:20px;
  padding:9px 16px 9px 38px; font-size:13px; width:190px; outline:none; font-family:var(--font-body);
  transition:background .3s ease, width .3s ease, box-shadow .3s ease;
}
.blend-inp:focus{ background:var(--blend-surface-focus); box-shadow:none!important; border-color:transparent!important; }
.blend-btn{
  background:transparent; color:var(--muted); border:1px solid transparent; border-radius:20px;
  padding:9px 18px; font-size:13px; font-weight:500; cursor:pointer; font-family:var(--font-body);
  transition:background .3s ease, color .3s ease;
}
.blend-btn:hover{ background:var(--blend-surface); color:var(--text); }

/* Theme toggle — skeuomorphic glass switch with external sun/moon icons */
.theme-switch-wrap{ display:flex; align-items:center; gap:10px; margin:0 4px; }
.ts-icon{ width:17px; height:17px; flex-shrink:0; color:var(--muted); opacity:0.55; transition:opacity .3s ease, color .3s ease; }
.ts-icon.active{ opacity:1; color:var(--accent); }
.theme-switch{
  position:relative; width:52px; height:26px; border-radius:20px; cursor:pointer; flex-shrink:0;
  background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.15));
  border:1px solid var(--glass-border);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.35), inset 0 -1px 0 rgba(255,255,255,0.04);
  transition:background .45s ease, border-color .45s ease;
}
html.light .theme-switch{
  background:linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.02));
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.10), inset 0 -1px 0 rgba(255,255,255,0.5);
}
.theme-switch .knob{
  position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #6a6a6e 0%, #2c2c30 45%, #0a0a0c 100%);
  box-shadow:0 2px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.25);
  transition:left .45s cubic-bezier(.34,1.56,.64,1), background .45s ease;
}
html.light .theme-switch .knob{
  left:28px;
  background:radial-gradient(circle at 35% 30%, #ffffff 0%, #e4e2da 55%, #c9c6ba 100%);
  box-shadow:0 2px 6px rgba(0,0,0,0.18), inset 0 1px 1px rgba(255,255,255,0.9);
}

/* Global smooth transitions for theme + navigation changes */
body, .card, .card-hov, nav.navbar, footer, input, select, textarea, span, p, h1, h2, h3, h4, div{
  transition:background-color .35s ease, border-color .35s ease, color .35s ease;
}
main{ animation:pageFade .45s ease; }
@keyframes pageFade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.page-shell,main > div{ padding-top:var(--page-start)!important; }
.nav-search{ flex:0 1 280px; min-width:170px; }
.nav-search .blend-inp{ width:100%; }
.nav-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.category-launcher{
  position:fixed; top:calc(var(--header-edge) + 7px); left:50%; transform:translateX(-50%); z-index:990;
  width:38px; height:30px; border-radius:0 0 18px 18px; border:1px solid var(--glass-border); border-top:0;
  background:var(--drawerBg); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 8px 22px var(--shadow);
  transition:color .2s ease, box-shadow .2s ease, background .2s ease;
}
.category-launcher:hover,.category-launcher[aria-expanded="true"]{
  color:var(--accent); background:var(--cardHov); box-shadow:0 0 22px rgba(255,138,61,.48),0 8px 22px var(--shadow);
}
.category-launcher svg{ transition:transform .25s ease; }
.category-launcher[aria-expanded="true"] svg{ transform:rotate(180deg); }
.category-mega-menu{
  position:fixed; top:calc(var(--header-edge) + 43px); left:50%; transform:translateX(-50%); z-index:980;
  width:min(920px,calc(100% - 32px)); padding:24px; border:1px solid var(--glass-border); border-radius:18px;
  background:var(--drawerBg); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  box-shadow:0 22px 54px var(--shadowHov); animation:slideUp .22s ease;
}
.category-menu-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
.category-type-link{ display:block; width:100%; border:0; background:transparent; color:var(--muted); padding:7px 0; text-align:left; cursor:pointer; font-size:13px; }
.category-type-link:hover{ color:var(--accent); }
.header-icon-button{ width:40px; height:40px; padding:0!important; display:flex; align-items:center; justify-content:center; }

/* Layout containers */
.max-1360{ max-width:1360px; margin:0 auto; }
.max-1200{ max-width:1200px; margin:0 auto; }
.max-960{ max-width:960px; margin:0 auto; }
.max-860{ max-width:860px; margin:0 auto; }
.max-1040{ max-width:1040px; margin:0 auto; }
.max-540{ max-width:540px; margin:0 auto; }
.grid-auto-265{ display:grid; grid-template-columns:repeat(auto-fill,minmax(265px,1fr)); gap:22px; }
.grid-auto-280{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
.grid-auto-175{ display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:14px; }
.grid-auto-200{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:36px; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }

@media (max-width: 900px){
  .hero-split, .about-hero{ flex-direction:column!important; min-height:auto!important; }
  .hero-right, .about-hero-right{ width:100%!important; min-height:280px; }
  .grid-2{ grid-template-columns:1fr!important; }
  .checkout-grid{ grid-template-columns:1fr!important; }
  .product-grid-2{ grid-template-columns:1fr!important; gap:32px!important; }
  nav.navbar{ padding:0 16px!important; gap:12px; }
  .nav-brand-name{ font-size:17px!important; letter-spacing:4px!important; }
  .nav-search{ flex:1 1 190px; }
  .theme-switch-wrap{ gap:6px; }
  .drawer{ width:100%!important; max-width:430px; }
  .admin-shell{ flex-direction:column!important; }
  .admin-sidebar{ width:100%!important; position:static!important; height:auto!important; }
  h1{ font-size:38px!important; }
}
@media (max-width: 720px){
  :root{ --header-edge:164px; --page-start:206px; }
  nav.navbar{ height:128px!important; flex-wrap:wrap; align-content:center; }
  .nav-search{ order:3; flex:1 0 100%; width:100%; }
  .nav-search .blend-inp{ height:38px; }
  .nav-actions{ margin-left:auto; }
  .category-menu-grid{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width: 600px){
  .container-pad{ padding-left:20px!important; padding-right:20px!important; }
  .ts-icon{ display:none; }
  .theme-switch-wrap{ margin:0; }
  .category-mega-menu{ padding:18px; }
}
@media (max-width: 480px){
  .nav-brand-name{ display:none; }
}
</style>

      ["From a name to a philosophy","KOMPSIA takes its name from the Greek Κομψία — elegance, refinement, a quiet sense of taste that doesn't need to announce itself. That idea sits behind everything we make: no logos shouting for attention, no fast-fashion turnover. Just precise construction, honest materials, and pieces designed to be used for decades, not seasons."],
      ["Why Dubai","Dubai sits at the crossroads of the world's finest raw materials and one of its most design-literate audiences. We saw a gap: a city full of people who appreciate quality but were mostly shopping European heritage houses at European heritage prices. KOMPSIA exists to close that gap — expertly tanned leather, Dubai-based service, without the markup of a hundred-year-old name on the label."],
      ["How we build","Every hide we use is full-grain, sourced from established tanneries in India with generations of leather-crafting expertise behind them. Our hardware is solid brass and stainless steel. Nothing is bonded, coated, or \"leather-look.\" If a piece doesn't meet our own standard, it doesn't get a KOMPSIA stamp — that's the whole business model."],
      ["Where we're headed","We're still early. Our first collections focus on the essentials — shoes, belts, bags, wallets — the things you reach for every day. As we grow, we're building toward a small, considered catalogue rather than a sprawling one: fewer products, each one earning its place."],
    ],
    milestones: [
      ["2026","KOMPSIA founded in Dubai with a single question: why should timeless leather goods be either mass-produced or unaffordably \"heritage\"?"],
      ["2026","Sourcing partnerships established with full-grain leather tanneries in India, and our first prototype collection developed and quality-tested across shoes, belts, and bags."],
      ["2026","KOMPSIA opens for business in Dubai, UAE — our first full collection launches."],
    ],
    values: [
      ["Full-grain, always.","No bonded leather, no shortcuts, ever."],
      ["Built for decades.","Every piece backed by a 10-year warranty."],
      ["Considered, not constant.","We'd rather launch 10 pieces we're proud of than 100 we're not."],
      ["Service that matches the product.","Dubai-based support, real people, fast answers."],
    ],
  },
  faq: [
    { category:"Orders & Payment", items:[
      ["How do I place an order?","Browse the collection, select a size if applicable, and add the item to your cart. Once you're ready, proceed to checkout, confirm your delivery details, and choose Card or Cash on Delivery."],
      ["What payment methods do you accept?","We accept Visa, Mastercard, American Express, Apple Pay, and Cash on Delivery (COD) across the UAE. All card payments are processed through a 256-bit SSL encrypted, PCI-DSS compliant gateway."],
      ["Is Cash on Delivery available everywhere?","COD is currently available across the UAE. For other GCC destinations, card payment is required at checkout."],
      ["Can I use a discount code?","Yes — enter your code in the Discount Code box on the Payment step of checkout. Only one code can be applied per order."],
      ["Can I change or cancel my order after placing it?","Contact us within 1 hour of placing your order and we'll do our best to amend or cancel it before it's packed. Once an order reaches \"Packed\" status, it can no longer be changed."],
    ]},
    { category:"Shipping & Delivery", items:[
      ["How long does delivery take?","Standard Delivery: 3–5 business days. Express Delivery: 1–2 business days. Same-Day Delivery: available in Dubai only, order before 12 PM for delivery by 8 PM the same day."],
      ["Do you offer free shipping?","Yes — orders over AED 500 qualify for complimentary standard shipping. Orders below that threshold have a flat AED 25 shipping fee."],
      ["Which countries do you deliver to?","We currently deliver across the UAE, Saudi Arabia, Kuwait, Qatar, Bahrain, and Oman. GCC deliveries outside the UAE typically take 4–7 business days."],
      ["How do I track my order?","Go to My Orders while signed in to see live status and tracking for every order you've placed."],
    ]},
    { category:"Returns & Exchanges", items:[
      ["What is your return policy?","We accept returns within 30 days of delivery for unused items in their original packaging with tags attached. Contact us with your order ID to start a return."],
      ["Who pays for return shipping?","Return shipping is the customer's responsibility unless the item arrived defective or incorrect, in which case we cover the cost."],
      ["How long do refunds take?","Once we receive and inspect the returned item, refunds are processed within 5–7 business days to your original payment method. Cash on Delivery orders are refunded via bank transfer."],
      ["Can I exchange an item for a different size?","Yes, subject to stock availability. Contact us to arrange an exchange — it's usually faster to return the original and place a new order if you need it quickly."],
    ]},
    { category:"Product & Sizing", items:[
      ["How do I know what size to order?","Check our Size Guide for shoe (EU) and belt (S–XL) sizing charts with measurement instructions. If you're between sizes, we generally recommend sizing up for shoes."],
      ["What materials do you use?","All KOMPSIA pieces are crafted from full-grain leather, sourced from established tanneries in India. Hardware is solid brass or stainless steel, plated where noted."],
      ["Are your products genuine leather?","Yes, 100% full-grain leather across our shoes, belts, bags, and wallets — no bonded or synthetic leather is used in any KOMPSIA product."],
      ["Do you restock sold-out items?","Most core styles are restocked within 4–6 weeks. Limited-edition pieces are not restocked once sold out."],
    ]},
    { category:"Account & Security", items:[
      ["Do I need an account to shop?","You can browse freely without an account, but you'll need to sign in to complete checkout, view order history, or use saved details."],
      ["How do I reset my password?","On the sign-in screen, select \"Forgot password?\", enter your registered email, and you'll receive a one-time code (OTP) to verify and set a new password."],
      ["Is my payment information secure?","Yes. We never store your full card details on our servers. All transactions are processed through an encrypted, PCI-DSS compliant payment gateway."],
    ]},
    { category:"Warranty & Care", items:[
      ["Do KOMPSIA products come with a warranty?","Yes — every product includes a 10-year warranty against manufacturing defects in materials and workmanship."],
      ["How do I care for my leather goods?","See our Leather Care Guide for cleaning, conditioning, and storage recommendations to keep your KOMPSIA pieces looking their best for years."],
    ]},
  ],

/* ===================================================================
 * ACCOUNT VIEW MODEL — profile and address data are loaded from Supabase and
 * kept in memory for rendering. Personal data is no longer written to browser
 * storage; row-level security keeps the durable records account-scoped.
 * =================================================================== */
let accounts = {};
function getAccount(email){
  if(!email) return null;
  if(!accounts[email]){
    accounts[email] = {
      profile: { fullName:"", dob:"", idType:"Emirates ID", idNumber:"", nationality:"", phone:"", addresses:[], paymentMethods:[] },
      wallet: { balance:0, transactions:[] },
      points: { balance:0, history:[] },
      notifications: [],
    };
  }
  // backfill fields for accounts created before a schema addition
  const a = accounts[email];
  if(!a.profile) a.profile = { fullName:"", dob:"", idType:"Emirates ID", idNumber:"", nationality:"", phone:"", addresses:[], paymentMethods:[] };
  if(!a.wallet) a.wallet = { balance:0, transactions:[] };
  if(!a.points) a.points = { balance:0, history:[] };
  if(!a.notifications) a.notifications = [];
  return a;
}
function saveAccounts(){ /* Personal data is persisted through Supabase only. */ }
function loadAccounts(){ /* Do not hydrate legacy browser-stored personal data. */ }
function addNotification(email, type, title, body){
  const acc = getAccount(email);
  if(!acc) return;
  acc.notifications.unshift({ id: Date.now()+Math.random().toString(36).slice(2,7), type, title, body, date: new Date().toISOString(), read:false });
  saveAccounts();
}
function creditWallet(email, amount, reason){
  const acc = getAccount(email);
  if(!acc || amount<=0) return;
  acc.wallet.balance += amount;
  acc.wallet.transactions.unshift({ id: Date.now()+Math.random().toString(36).slice(2,7), type:"credit", amount, reason, date: new Date().toISOString() });
  saveAccounts();
}
function debitWallet(email, amount, reason){
  const acc = getAccount(email);
  if(!acc || amount<=0) return false;
  if(acc.wallet.balance < amount) return false;
  acc.wallet.balance -= amount;
  acc.wallet.transactions.unshift({ id: Date.now()+Math.random().toString(36).slice(2,7), type:"debit", amount, reason, date: new Date().toISOString() });
  saveAccounts();
  return true;
}
function earnPoints(email, orderTotal, orderNetSpend){
  const acc = getAccount(email);
  if(!acc) return 0;
  const pts = Math.floor(orderNetSpend/100*POINTS_EARN_RATE);
  if(pts<=0) return 0;
  acc.points.balance += pts;
  acc.points.history.unshift({ id: Date.now()+Math.random().toString(36).slice(2,7), type:"earned", points:pts, reason:`Order purchase (AED ${orderTotal.toFixed(0)})`, date: new Date().toISOString() });
  saveAccounts();
  return pts;
}
function redeemPointsForOrder(email, points, discountAmount){
  const acc = getAccount(email);
  if(!acc || points<=0) return;
  acc.points.balance = Math.max(0, acc.points.balance - points);
  acc.points.history.unshift({ id: Date.now()+Math.random().toString(36).slice(2,7), type:"redeemed", points:-points, reason:`Redeemed for AED ${discountAmount} discount`, date: new Date().toISOString() });
  saveAccounts();
}

function getProduct(id){ return state.products.find(p=>p.id===id); }

function cartSub(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }
function shippingCost(){ const sub=cartSub(); return sub>0 && sub<500 ? 25 : 0; }
function discAmt(){ return state.coupon ? Math.round(cartSub()*state.coupon.pct/100) : 0; }
const POINTS_REDEMPTION_RATE = 25; // 25 points = AED 1 discount
const POINTS_EARN_RATE = 20; // 20 points earned per AED 100 spent
function pointsDiscAmt(){
  if(!state.usePoints || !state.user) return 0;
  const acc = getAccount(state.user.email);
  if(!acc) return 0;
  const remaining = Math.max(0, cartSub() - discAmt());
  const maxFromPoints = Math.floor(acc.points.balance / POINTS_REDEMPTION_RATE);
  return Math.min(maxFromPoints, remaining);
}

    const pid = parseInt(parts[1]);
    if(getProduct(pid)){ state.selProdId = pid; state.page = "product"; }
    else state.page = "home";
  } else if(parts[0]==="catalog" && parts[1]){
    state.catFilter = parts[1];
    const requestedType = parts.slice(2).join("-");
    state.productTypeFilter = (PRODUCT_TYPE_NAV[state.catFilter]||[]).some(type=>type.id===requestedType) ? requestedType : null;

async function hydrateAuthenticatedCustomer(session, event){
  if(!session?.user){
    if(event==="SIGNED_OUT" || state.user) clearVisibleSelections();
    state.user=null; state.isAdmin=false; state.isStaff=false;
    state.backend.ready=true;
    render();
    return;
  }

  const authUser = session.user;
  const metadataName = String(authUser.user_metadata?.full_name || authUser.user_metadata?.name || "").trim();
  state.user = {
    id:authUser.id,
    name:metadataName || authUser.email?.split("@")[0] || "Customer",
    email:authUser.email || "",
    role:"customer",
  };
  loadCart(authUser.id);
  loadFavourites(authUser.id);
  state.loginOpen=false;
  state.loginTab="login";
  state.loginForm.step="email";
  state.loginForm.otp="";
  state.backend.ready=true;
  render();

  try{
    const [accountData, orders, remoteCart, staffRole] = await Promise.all([
      KompsiaBackend.loadProfile(),
      KompsiaBackend.loadOrders(),
      KompsiaBackend.loadCart(),
      KompsiaBackend.getStaffRole(),
    ]);
    const profile = accountData.profile || {};
    const acc = getAccount(state.user.email);
    acc.profile = {
      ...acc.profile,
      firstName:profile.first_name || "",
      lastName:profile.last_name || "",
      fullName:[profile.first_name,profile.last_name].filter(Boolean).join(" ") || state.user.name,
      dob:profile.date_of_birth || "",
      phone:profile.phone || "",
      preferredLanguage:profile.preferred_language || "en",
      marketingOptIn:Boolean(profile.marketing_opt_in),
      addresses:(accountData.addresses||[]).map(a=>({
        id:a.id,
        label:a.label || "Address",
        fullName:a.full_name,
        phone:a.phone || "",
        line:[a.address_line1,a.address_line2].filter(Boolean).join(", "),
        city:a.city,
        country:a.country_code,
        isDefault:Boolean(a.is_default_shipping),
      })),
      paymentMethods:[],
    };
    state.user.name = acc.profile.fullName || state.user.name;
    const defaultAddress = acc.profile.addresses.find(a=>a.isDefault) || acc.profile.addresses[0];
    state.form.name = state.user.name;
    state.form.email = state.user.email;
    state.form.phone = acc.profile.phone || defaultAddress?.phone || "";
    if(defaultAddress){
      state.form.address = defaultAddress.line;
      state.form.city = defaultAddress.city;
      const countryNames = {AE:"UAE",SA:"Saudi Arabia",KW:"Kuwait",QA:"Qatar",BH:"Bahrain",OM:"Oman"};
      state.form.country = countryNames[defaultAddress.country] || "UAE";
    }
    state.orders = orders.map(remoteOrderToState);

    if((remoteCart.items||[]).length){
      state.cart = remoteCart.items.map(row=>{
        const product = row.products || {};
        const variant = row.product_variants || {};
        return {
          id:product.id,
          backendId:product.id,
          variantId:variant.id || null,
          name:product.name || "KOMPSIA item",
          price:Number(variant.price_override ?? product.base_price ?? 0),
          qty:row.quantity,
          stock:Number(variant.stock_quantity ?? 0),
          cat:"",
          img:null,
        };
      });
    }

    const role = typeof staffRole==="string" ? staffRole : staffRole?.role;
    state.isStaff = ["staff","admin","owner"].includes(role);
    state.isAdmin = ["admin","owner"].includes(role);
    state.backend.lastError=null;
    saveAccounts();
    saveCart();
    render();
    if(event==="SIGNED_IN") notify(`Welcome, ${state.user.name}!`);
  }catch(error){
    console.warn("KOMPSIA account hydration failed", error?.message || error);
    state.backend.lastError="ACCOUNT_SYNC_FAILED";
    render();
    notify("You're signed in, but some account details could not be refreshed.","error");
  }
}

    const session = await KompsiaBackend.init(hydrateAuthenticatedCustomer);
    state.backend.available=true;
    await hydrateAuthenticatedCustomer(session,"INITIAL_SESSION");
  }catch(error){
    console.warn("KOMPSIA backend unavailable", error?.message || error);
    state.backend.ready=true;
    state.backend.available=false;
    state.backend.lastError=error?.message || "BACKEND_UNAVAILABLE";
    render();
  }
}
async function requestLoginOtp(){
  const f = state.loginForm;
  if(!f.email){ notify("Enter your email address","error"); return; }
  const shouldCreateUser = state.loginTab==="signup";
  if(shouldCreateUser && !String(f.name||"").trim()){
    notify("Enter your full name to create an account","error");
    return;
  }
  f.busy=true; render();
  try{
    await KompsiaBackend.requestEmailOtp(f.email,shouldCreateUser?f.name:"",shouldCreateUser);
    f.step="otp";
    notify(`Check your email for the six-digit ${shouldCreateUser?'confirmation':'sign-in'} code.`,"info");
  }catch(error){ notify(friendlyBackendError(error),"error"); }
  finally{ f.busy=false; render(); }
}
async function verifyLoginOtp(){
  const f = state.loginForm;
  f.busy=true; render();
  try{
    await KompsiaBackend.verifyEmailOtp(f.email,f.otp);
    f.otp="";
  }catch(error){ notify(friendlyBackendError(error),"error"); }
  finally{ f.busy=false; render(); }
}

function saveProductDraft(){
  const d = state.productEditDraft;
  const name = (d.name||"").trim();
  if(!name){ notify("Product name is required","error"); return; }
  const price = Math.max(0, parseFloat(d.price)||0);
  if(price<=0){ notify("Enter a valid price","error"); return; }
  const payload = {
    name, cat:d.cat, price,
    orig: d.orig ? Math.max(0, parseFloat(d.orig)||0) : null,
    stock: Math.max(0, parseInt(d.stock)||0),
    badge: d.badge || null,
    img: d.img,
    desc: (d.desc||"").trim(),
  };
  if(state.productEditId==="new"){
    const nextId = Math.max(0, ...state.products.map(p=>p.id)) + 1;
    state.products.push({ id: nextId, rating:5.0, reviews:0, ...payload });
    notify(`${name} added to catalogue`);
  } else {
    const p = getProduct(state.productEditId);
    if(p) Object.assign(p, payload);
    notify(`${name} updated`);
  }
  state.productEditId = null;
  state.productEditDraft = null;
  saveCMS();
  render();
}

  state.products = state.products.filter(pr=>pr.id!==id);

/* ===================================================================
 * LOCAL PERSISTENCE — this is a static site with no backend/database.
 * We persist CMS edits (site content, coupons, products) to this
 * browser's localStorage so they survive a page refresh on the SAME
 * device. This does NOT sync across devices or visitors — every other
 * visitor still sees the original defaults baked into this file. For
 * real, shared, secure persistence this needs a real backend.
 * =================================================================== */
const CMS_STORAGE_KEY = "kompsia_cms_v1";
function saveCMS(){
  try{
    const payload = { siteContent, coupons: COUPONS, products: state.products };
    localStorage.setItem(CMS_STORAGE_KEY, JSON.stringify(payload));
  }catch(e){ console.warn("Could not save CMS content locally", e); }
}
function loadCMS(){
  try{
    const raw = localStorage.getItem(CMS_STORAGE_KEY);
    if(!raw) return;
    const payload = JSON.parse(raw);
    if(payload.siteContent) Object.assign(siteContent, payload.siteContent);
    if(payload.coupons) { COUPONS = payload.coupons; }
    if(payload.products && Array.isArray(payload.products)) state.products = payload.products;
  }catch(e){ console.warn("Could not load saved CMS content", e); }
}

async function saveNewAddress(){
  if(!state.user) return;
  const label = document.getElementById("addr-label").value.trim();
  const phone = document.getElementById("addr-phone").value.trim();
  const line = document.getElementById("addr-line").value.trim();
  const city = document.getElementById("addr-city").value.trim();
  const country = document.getElementById("addr-country").value;
  if(!label || !line || !city){ notify("Fill in the required address fields","error"); return; }
  const acc = getAccount(state.user.email);
  const countryCodes = {UAE:"AE","Saudi Arabia":"SA",Kuwait:"KW",Qatar:"QA",Bahrain:"BH",Oman:"OM"};
  try{
    const saved = await KompsiaBackend.saveAddress({
      label,
      fullName:acc.profile.fullName || state.user.name,
      phone,
      addressLine1:line,
      city,
      countryCode:countryCodes[country] || "AE",
      isDefaultShipping:acc.profile.addresses.length===0,
      isDefaultBilling:acc.profile.addresses.length===0,
    });
    acc.profile.addresses.push({id:saved.id,label,phone,line,city,country:saved.country_code,isDefault:saved.is_default_shipping});
    saveAccounts();
    state.addressFormOpen = false;
    notify("Address saved");
  }catch(error){ notify(friendlyBackendError(error),"error"); }
  render();
}
async function setDefaultAddress(i){
  if(!state.user) return;
  const acc = getAccount(state.user.email);
  const address = acc.profile.addresses[i];
  try{
    if(address?.id) await KompsiaBackend.setDefaultAddress(address.id);
    acc.profile.addresses.forEach((a,idx)=>a.isDefault = idx===i);
    saveAccounts();
  }catch(error){ notify(friendlyBackendError(error),"error"); }
  render();
}
async function deleteAddress(i){
  if(!state.user) return;
  const acc = getAccount(state.user.email);
  const address = acc.profile.addresses[i];
  try{
    if(address?.id) await KompsiaBackend.deleteAddress(address.id);
    acc.profile.addresses.splice(i,1);
    if(acc.profile.addresses.length>0 && !acc.profile.addresses.some(a=>a.isDefault)) acc.profile.addresses[0].isDefault = true;
    saveAccounts();
    notify("Address removed");
  }catch(error){ notify(friendlyBackendError(error),"error"); }
  render();
}

function redeemReward(name, cost){
  if(!state.user) return;
  const acc = getAccount(state.user.email);
  if(acc.points.balance < cost){ notify("Not enough points","error"); return; }
  acc.points.balance -= cost;
  acc.points.history.unshift({ id: Date.now()+Math.random().toString(36).slice(2,7), type:"redeemed", points:-cost, reason:`Redeemed: ${name}`, date: new Date().toISOString() });
  saveAccounts();
  addNotification(state.user.email, "offer", "Reward redeemed", `You redeemed "${name}" for ${cost} points. Check your email for details on using it.`);
  notify(`Redeemed: ${name}! Check Notifications for details.`);
  render();
}
function initiateReturn(orderId){
  const o = state.orders.find(o=>o.id===orderId);
  if(!o) return;
  if(!confirm(`Start a return for order ${orderId}? A refund of AED ${o.total.toFixed(0)} will be credited to your KOMPSIA wallet once approved.`)) return;
  o.status = "Cancelled";
  if(o.customerEmail){
    creditWallet(o.customerEmail, o.total, `Refund for order ${orderId}`);
    addNotification(o.customerEmail, "order", "Refund credited", `AED ${o.total.toFixed(0)} from your return on order ${orderId} has been added to your KOMPSIA wallet.`);
  }
  notify(`Return started — AED ${o.total.toFixed(0)} credited to your wallet`);
  render();
}

    const connector = i<stepLabels.length-1 ? `<div style="flex:1;height:1px;background:${state.step>n?'var(--suc)':'var(--border)'};margin:0 14px;transition:background 0.3s;"></div>` : "";
    return `
    <div style="display:flex;align-items:center;flex:${i<stepLabels.length-1?1:0};">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${circleBg};color:${circleColor};font-weight:700;font-size:14px;flex-shrink:0;transition:all 0.3s;">${state.step>n?"✓":n}</div>
        <span style="color:${state.step>=n?'var(--text)':'var(--muted)'};font-size:13px;font-weight:${state.step===n?700:400};white-space:nowrap;">${sl}</span>

      ${connector}

  let stepContent = "";
  const f = state.form;
  if(state.step===1){
    stepContent = `
    <div class="card" style="padding:30px;">
      <h3 style="color:var(--text);margin-bottom:22px;font-size:18px;font-weight:700;">${t('delivery_info_title')}</h3>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <input id="ck-name" class="inp" placeholder="${t('full_name_star')}" value="${esc(f.name)}" oninput="setFormField('name',this.value)">
        <input id="ck-email" class="inp" placeholder="${t('email_star')}" value="${esc(f.email)}" oninput="setFormField('email',this.value)">
        <input id="ck-phone" class="inp" placeholder="${t('phone_star')}" value="${esc(f.phone)}" oninput="setFormField('phone',this.value)">
        <input id="ck-address" class="inp" placeholder="${t('street_address_star')}" value="${esc(f.address)}" oninput="setFormField('address',this.value)">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <input id="ck-city" class="inp" placeholder="${t('city')}" value="${esc(f.city)}" oninput="setFormField('city',this.value)">
          <select class="inp" onchange="setFormField('country',this.value);render()" style="appearance:none;">
            ${["UAE","Saudi Arabia","Kuwait","Qatar","Bahrain","Oman"].map(c=>`<option ${f.country===c?'selected':''}>${c}</option>`).join("")}
          </select>
        </div>
        <button class="btn" onclick="if(!document.getElementById('ck-name').value||!document.getElementById('ck-address').value){notify('${t('fill_required')}','error');}else{goCheckoutStep(2);}" style="padding:14px;font-size:15px;border-radius:20px;">${t('continue_shipping')}</button>
      </div>
    </div>`;
  } else if(state.step===2){
    const shipOpts = [
      {label:"Standard Delivery",time:"3–5 business days",price:shippingCost(),sel:true},
      {label:"Express Delivery",time:"1–2 business days",price:50,sel:false},
      {label:"Same-Day (Dubai only)",time:"Today by 8 PM",price:85,sel:false},
    ];
    const optsHTML = shipOpts.map(opt=>`
      <div class="card" style="padding:16px 20px;margin-bottom:12px;border:1px solid ${opt.sel?'var(--accent)':'var(--border)'};background:${opt.sel?'rgba(255,138,61,0.03)':'var(--card)'};">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div><div style="color:var(--text);font-weight:600;font-size:15px;">${opt.label}${opt.sel?'<span style="color:var(--accent);font-size:12px;margin-left:8px;">✓ Selected</span>':''}</div><div style="color:var(--muted);font-size:13px;margin-top:3px;">${opt.time}</div></div>
          <div style="color:${opt.price===0?'var(--suc)':'var(--accent)'};font-weight:700;font-size:16px;">${opt.price===0?"FREE":aed(opt.price)}</div>
        </div>
      </div>`).join("");
    stepContent = `
    <div class="card" style="padding:30px;">
      <h3 style="color:var(--text);margin-bottom:22px;font-size:18px;font-weight:700;">Shipping Method</h3>
      ${optsHTML}
      <div style="display:flex;gap:12px;margin-top:20px;">
        <button class="btn-ghost" onclick="goCheckoutStep(1)" style="flex:1;padding:13px;">${t('back')}</button>
        <button class="btn" onclick="goCheckoutStep(3)" style="flex:2;padding:13px;font-size:15px;border-radius:20px;">${t('continue_payment')}</button>
      </div>
    </div>`;
  } else if(state.step===3){
    const cardFieldsHTML = `
        <div style="background:var(--accent-tint);border:1px solid var(--accent-tint-border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:13px;line-height:1.7;">
          🔒 Card collection is not enabled yet. KOMPSIA does not collect or store card details on this preview site.
        </div>`;
    const codNoteHTML = `
        <div style="background:var(--accent-tint);border:1px solid var(--accent-tint-border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:13px;line-height:1.7;">
          💵 Pay in cash when your order arrives. Please have the exact amount — <span style="color:var(--accent);font-weight:700;">${aed(cartTotal())}</span> — ready for the courier.
        </div>`;
    const walletAcc = state.user ? getAccount(state.user.email) : null;
    const walletBal = walletAcc ? walletAcc.wallet.balance : 0;
    const walletInsufficient = walletBal < cartTotal();
    const walletNoteHTML = `
        <div style="background:${walletInsufficient?'rgba(166,73,59,0.08)':'var(--accent-tint)'};border:1px solid ${walletInsufficient?'var(--err)':'var(--accent-tint-border)'};border-radius:14px;padding:14px 16px;color:var(--text);font-size:13px;line-height:1.7;">
          💰 Wallet balance: <span style="font-weight:700;">${aed(walletBal)}</span>.
          ${walletInsufficient ? `<span style="color:var(--err);"> Not enough balance to cover this order — top up in Wallet &amp; Rewards or choose another payment method.</span>` : ` <span style="color:var(--suc);">${aed(cartTotal())} will be deducted from your wallet.</span>`}
        </div>`;
    const pointsAvail = walletAcc ? walletAcc.points.balance : 0;
    const pointsPossibleDisc = Math.min(Math.floor(pointsAvail/POINTS_REDEMPTION_RATE), Math.max(0,cartSub()-discAmt()));
    stepContent = `
    <div class="card" style="padding:30px;margin-bottom:18px;">
      <h3 style="color:var(--text);margin-bottom:6px;font-size:18px;font-weight:700;">${t('discount_code')}</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">Have a code? Apply it before you pay.</p>
      <div style="display:flex;gap:8px;">
        <input id="pay-coupon-input" class="inp" value="${esc(state.couponInput)}" oninput="setCouponInput(this.value)" placeholder="e.g. OPENING20" style="flex:1;">
        <button class="btn" onclick="applyCoupon()" style="padding:0 22px;white-space:nowrap;">${t('apply')}</button>
      </div>
      ${state.coupon ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;"><span style="color:var(--suc);font-size:13px;font-weight:600;">✓ ${esc(state.coupon.label)} applied</span><button onclick="clearCoupon()" title="Remove code" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;">✕</button></div>` : `<div style="color:var(--muted);font-size:11px;margin-top:10px;opacity:0.75;">Try: KOMPSIA10 · OPENING20 · VIP30</div>`}
    </div>
    ${walletAcc && pointsAvail>0 ? `
    <div class="card" style="padding:30px;margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h3 style="color:var(--text);margin-bottom:5px;font-size:18px;font-weight:700;">⭐ Use Your Points</h3>
          <p style="color:var(--muted);font-size:13px;">You have <span style="color:var(--accent);font-weight:700;">${pointsAvail.toLocaleString()} pts</span> — worth up to ${aed(pointsPossibleDisc)}</p>
        </div>
        <div onclick="togglePointsRedeem()" style="width:46px;height:26px;border-radius:20px;background:${state.usePoints?'var(--accent)':'var(--border)'};position:relative;cursor:pointer;flex-shrink:0;transition:background .25s ease;">
          <div style="width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:${state.usePoints?'23px':'3px'};transition:left .25s ease;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>
        </div>
      </div>
      ${state.usePoints ? `<div style="color:var(--suc);font-size:13px;margin-top:12px;font-weight:600;">✓ Applying ${aed(pointsDiscAmt())} discount from points</div>` : ""}
    </div>` : ""}
    <div class="card" style="padding:30px;">
      <h3 style="color:var(--text);margin-bottom:22px;font-size:18px;font-weight:700;">${t('payment_method')}</h3>
      <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
        <div onclick="setPaymentMethod('card')" style="flex:1;min-width:140px;cursor:pointer;padding:14px 16px;border-radius:14px;border:1px solid ${state.paymentMethod==='card'?'var(--accent)':'var(--border)'};background:${state.paymentMethod==='card'?'var(--accent-tint)':'transparent'};display:flex;align-items:center;gap:10px;transition:all .25s ease;">
          <span style="font-size:18px;">💳</span>
          <span style="color:${state.paymentMethod==='card'?'var(--text)':'var(--muted)'};font-weight:600;font-size:14px;">Card</span>
        </div>
        <div onclick="setPaymentMethod('cod')" style="flex:1;min-width:140px;cursor:pointer;padding:14px 16px;border-radius:14px;border:1px solid ${state.paymentMethod==='cod'?'var(--accent)':'var(--border)'};background:${state.paymentMethod==='cod'?'var(--accent-tint)':'transparent'};display:flex;align-items:center;gap:10px;transition:all .25s ease;">
          <span style="font-size:18px;">💵</span>
          <span style="color:${state.paymentMethod==='cod'?'var(--text)':'var(--muted)'};font-weight:600;font-size:14px;">Cash on Delivery</span>
        </div>
        ${state.user ? `
        <div onclick="setPaymentMethod('wallet')" style="flex:1;min-width:140px;cursor:pointer;padding:14px 16px;border-radius:14px;border:1px solid ${state.paymentMethod==='wallet'?'var(--accent)':'var(--border)'};background:${state.paymentMethod==='wallet'?'var(--accent-tint)':'transparent'};display:flex;align-items:center;gap:10px;transition:all .25s ease;">
          <span style="font-size:18px;">💰</span>
          <span style="color:${state.paymentMethod==='wallet'?'var(--text)':'var(--muted)'};font-weight:600;font-size:14px;">Wallet</span>
        </div>` : ""}
      </div>
      ${state.paymentMethod==='card' ? `
      <div class="card" style="padding:13px 16px;margin-bottom:18px;background:var(--surface);border:1px solid rgba(91,140,110,0.19);">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:7px;">
          ${["💳 Visa","💳 Mastercard","💳 Amex","📱 Apple Pay"].map(m=>`<span style="background:var(--bg);color:var(--muted);padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border);">${m}</span>`).join("")}
        </div>
        <p style="color:var(--suc);font-size:12px;font-weight:600;">🔒 256-bit SSL Encrypted · PCI-DSS Compliant</p>
      </div>` : ""}
      <div style="display:flex;flex-direction:column;gap:14px;">
        ${state.paymentMethod==='card' ? cardFieldsHTML : state.paymentMethod==='wallet' ? walletNoteHTML : codNoteHTML}
        <div style="display:flex;gap:12px;margin-top:4px;">
          <button class="btn-ghost" onclick="goCheckoutStep(2)" style="flex:1;padding:13px;">${t('back')}</button>
          <button class="btn" onclick="placeOrder()" ${!window.KOMPSIA_CONFIG?.features?.checkout||state.paymentMethod==='wallet'&&walletInsufficient?'disabled':''} style="flex:2;padding:13px;font-size:15px;border-radius:20px;${!window.KOMPSIA_CONFIG?.features?.checkout||state.paymentMethod==='wallet'&&walletInsufficient?'opacity:0.5;cursor:not-allowed;':''}">${window.KOMPSIA_CONFIG?.features?.checkout ? (state.paymentMethod==='cod' ? `📦 ${t('place_order')} — Pay ${aed(cartTotal())} on Delivery` : `🔒 ${t('place_order')} — ${aed(cartTotal())}`) : 'Checkout is not live yet'}</button>
        </div>
      </div>
    </div>`;
  }

  const summaryItems = state.cart.map(item=>`
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;">
      <span style="color:var(--muted);max-width:60%;">${esc(item.name)} ×${item.qty}</span>
      <span style="color:var(--text);">${aed(item.price*item.qty)}</span>
    </div>`).join("");
  const summaryRows = [[t('subtotal'),aed(cartSub()),"var(--text)"]];
  if(discAmt()>0) summaryRows.push([t('discount'),`-${aed(discAmt())}`,"var(--suc)"]);
  if(pointsDiscAmt()>0) summaryRows.push(["Points Redeemed",`-${aed(pointsDiscAmt())}`,"var(--suc)"]);
  summaryRows.push([t('shipping'), shippingCost()===0?t('free'):aed(shippingCost()), shippingCost()===0?"var(--suc)":"var(--text)"]);
  const summaryRowsHTML = summaryRows.map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px;"><span>${l}</span><span style="color:${c};font-weight:600;">${v}</span></div>`).join("");

  return `
  <div style="padding-top:110px;background:transparent;">
    <div class="max-960 container-pad" style="padding:40px 40px;">
      ${backButtonHTML()}
      <h1 style="color:var(--text);font-family:var(--font-display);margin-bottom:36px;font-size:36px;">${t('checkout_title')}</h1>
      ${!window.KOMPSIA_CONFIG?.features?.checkout ? `<div class="card" style="padding:14px 18px;margin-bottom:24px;border:1px solid var(--accent-tint-border);color:var(--muted);font-size:13px;line-height:1.6;"><span style="color:var(--accent);font-weight:700;">Preview only:</span> checkout and payment are disabled while the catalogue and payment provider are being prepared. Your cart remains saved on this device.</div>` : ""}
      <div style="display:flex;align-items:center;margin-bottom:44px;flex-wrap:wrap;gap:10px;">${stepsHTML}</div>
      <div class="checkout-grid" style="display:grid;grid-template-columns:1fr 310px;gap:28px;">
        <div>${stepContent}</div>
        <div class="card" style="padding:22px;height:fit-content;background:var(--surface);">
          <h3 style="color:var(--text);margin-bottom:16px;font-size:15px;font-weight:700;">${t('order_summary')}</h3>
          ${summaryItems}
          <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:8px;">
            ${summaryRowsHTML}
            <div style="display:flex;justify-content:space-between;color:var(--accent);font-weight:800;font-size:20px;border-top:1px solid var(--border);padding-top:10px;"><span>${t('total')}</span><span>${aed(cartTotal())}</span></div>
          </div>
          ${state.coupon ? `<div style="margin-top:12px;padding:8px 12px;background:rgba(91,140,110,0.07);border-radius:20px;color:var(--suc);font-size:13px;border:1px solid rgba(91,140,110,0.16);">✓ ${state.coupon.label}</div>` : ""}
        </div>
      </div>
    </div>
  </div>`;
}

function ordersPageHTML(){
  const ORDER_STAGES = ["Processing","Confirmed","Packed","Shipped","Delivered"];
  const STAGE_LABELS = {Processing:"Confirmed",Confirmed:"Confirmed",Packed:"Packed",Shipped:"Out for Delivery",Delivered:"Delivered"};
  const STAGE_DESC = {
    Processing:"We've received your order and it's being reviewed.",
    Confirmed:"Your order is confirmed and being prepared for packing.",
    Packed:"Your items have been carefully packed and are ready for courier pickup.",
    Shipped:"Your shipment has left the warehouse and is on its way to your delivery address.",
    Delivered:"Delivered! We hope you love your new KOMPSIA piece.",
  };
  const stageIcon = [iconTrackCheck, iconTrackBag, iconTrackClipboard, iconTrackTruck, iconTrackBox];
  function orderTrackerHTML(o){
    if(o.status==="Cancelled"){
      return `<div style="padding:16px;background:rgba(166,73,59,0.08);border:1px solid var(--err);border-radius:14px;color:var(--err);font-size:13px;">✕ This order was cancelled. If this wasn't expected, please contact us.</div>`;
    }
    const idx = Math.max(0, ORDER_STAGES.indexOf(o.status));
    const pct = idx/(ORDER_STAGES.length-1)*100;
    const done = idx===ORDER_STAGES.length-1;
    const bannerColor = done ? "var(--suc)" : "var(--accent)";
    const stepsHTML = ORDER_STAGES.map((s,i)=>{
      const reached = i<=idx;
      const isLast = i===ORDER_STAGES.length-1;
      return `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;">
        <div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${reached?bannerColor:'var(--card)'};border:1px solid ${reached?bannerColor:'var(--border)'};color:#fff;flex-shrink:0;">${reached?stageIcon[i](16,'#fff'):stageIcon[i](16,'var(--muted)')}</div>
        <div style="font-size:11px;margin-top:9px;color:${reached?'var(--text)':'var(--muted)'};font-weight:${i===idx?700:500};max-width:80px;">${STAGE_LABELS[s]}</div>
        ${isLast ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;">${done?'Delivered':'Est. delivery'}</div>` : (reached && s!=="Processing" ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;">on ${esc(o.date)}</div>` : "")}
      </div>`;
    }).join("");
    return `
    <div style="padding:20px 4px 6px;">
      <div style="background:${bannerColor}16;border:1px solid ${bannerColor}45;border-radius:16px;padding:16px 18px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
        <div>
          <div style="color:${bannerColor};font-weight:700;font-size:15px;margin-bottom:5px;">${STAGE_LABELS[ORDER_STAGES[idx]]}${!done?' · on schedule':''}</div>
          <div style="color:var(--muted);font-size:12.5px;line-height:1.65;max-width:480px;">${STAGE_DESC[ORDER_STAGES[idx]]}</div>
        </div>
        ${o.tracking ? (o.trackingUrl ? `<a href="${esc(o.trackingUrl)}" target="_blank" rel="noopener noreferrer" style="background:var(--card);border:1px solid var(--border);padding:9px 16px;border-radius:20px;color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap;">${esc(o.tracking)} ↗</a>` : `<div style="background:var(--card);border:1px solid var(--border);padding:9px 16px;border-radius:20px;color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap;">${esc(o.tracking)}</div>`) : ""}
      </div>
      <div style="position:relative;display:flex;">
        <div style="position:absolute;top:17px;left:0;right:0;height:2px;background:var(--border);"></div>
        <div style="position:absolute;top:17px;left:0;width:${pct}%;height:2px;background:${bannerColor};transition:width .4s ease;"></div>
        ${stepsHTML}
      </div>
    </div>`;
  }
  let body;
  const myOrders = state.user ? state.orders.filter(o=>o.customerEmail===state.user.email) : [];
  if(!state.user){
    body = `
    <div style="text-align:center;padding:80px 0;">
      <div style="font-size:52px;margin-bottom:18px;opacity:0.3;">🔐</div>
      <p style="color:var(--muted);margin-bottom:22px;">Sign in to view your order history</p>
      <button class="btn" onclick="openLogin()" style="padding:13px 36px;">${t('nav_signin')}</button>
    </div>`;
  } else if(myOrders.length===0){
    body = `
    <div style="text-align:center;padding:80px 0;">
      <div style="font-size:52px;margin-bottom:18px;opacity:0.3;">📦</div>
      <p style="color:var(--muted);margin-bottom:22px;">No orders yet</p>
      <button class="btn" onclick="nav('catalog')" style="padding:13px 36px;">Start Shopping</button>
    </div>`;
  } else {
    body = myOrders.map(o=>{
      const statusColor = o.status==="Delivered" ? "var(--suc)" : o.status==="Processing" ? "var(--accent)" : o.status==="Cancelled" ? "var(--err)" : "var(--amber)";
      const itemsHTML = o.items.map(item=>`<div style="display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px;"><span>${esc(item.name)} ×${item.qty}</span><span style="color:var(--text);">${aed(item.price*item.qty)}</span></div>`).join("");
      const trackerOpen = !!(state.trackerOpenIds && state.trackerOpenIds[o.id]);
      const actions = [["📄 Invoice",`notify('Invoice for ${o.id} ready')`],["🚚 "+(trackerOpen?"Hide Tracking":"Track Order"),`toggleTracker('${o.id}')`],["↩ Return",`initiateReturn('${o.id}')`],["💬 Support",`window.open('https://wa.me/${siteContent.contact.whatsapp.replace('+','')}','_blank','noopener,noreferrer')`]];
      return `
      <div class="card" style="padding:24px;margin-bottom:18px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
          <div>
            <div style="color:var(--accent);font-weight:800;font-size:20px;">${o.id}</div>
            <div style="color:var(--muted);font-size:13px;margin-top:3px;">${o.date} · ${esc(o.address)} · ${o.paymentMethod==='cod' ? '💵 COD' : '💳 Card'}</div>
          </div>
          <div style="display:flex;gap:12px;align-items:center;">
            <div style="background:${statusColor};color:#fff;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;opacity:0.92;">${o.status}</div>
            <div style="color:var(--accent);font-weight:800;font-size:20px;">${aed(o.total)}</div>
          </div>
        </div>
        ${trackerOpen ? `<div style="border-top:1px solid var(--border);">${orderTrackerHTML(o)}</div>` : ""}
        <div style="border-top:1px solid var(--border);padding-top:14px;">
          ${itemsHTML}
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
          ${actions.map(([l,fn])=>`<button class="btn-ghost" onclick="${fn}" style="padding:7px 16px;font-size:12px;">${l}</button>`).join("")}
        </div>
      </div>`;
    }).join("");
  }
  return `
  <div style="padding-top:110px;background:transparent;">
    <div class="container-pad" style="padding:20px 40px 0;">${backButtonHTML()}</div>
    <div class="container-pad" style="padding:20px 40px 32px;background:var(--bgAlt);border-bottom:1px solid var(--border);">
      <h1 style="color:var(--text);font-size:36px;font-family:var(--font-display);">${t('my_orders')}</h1>

  const fmtRel = (iso) => {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs/60000);
    if(mins<1) return "just now";
    if(mins<60) return `${mins}m ago`;
    const hrs = Math.floor(mins/60);
    if(hrs<24) return `${hrs}h ago`;
    const days = Math.floor(hrs/24);
    return `${days}d ago`;
  };
  const listHTML = filtered.length===0 ? `

  const supportLinks = [[t('my_orders'),"orders",null],[t('my_favourites'),"favourites",null],[t('size_guide_link'),"sizeguide",null],[t('nav_faq'),"faq",null],[t('ftr_feedback'),"feedback",null]];
  const col = (title,links) => `
    <div>
      <h4 style="color:var(--text);font-weight:700;margin-bottom:16px;font-size:12px;letter-spacing:3px;text-transform:uppercase;">${title}</h4>
      ${links.map(([l,p,c])=>`<div class="link-hover" onclick="nav('${p}'${c?`,'${c}'`:''})" style="color:var(--muted);font-size:13px;margin-bottom:10px;cursor:pointer;">${l}</div>`).join("")}
    </div>`;
  return `
  <footer style="border-top:1px solid var(--border);padding:56px 40px 28px;background:var(--bgAlt);">
    <div class="max-1200">
      <div class="grid-auto-200" style="margin-bottom:48px;">
        <div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;cursor:pointer;" onclick="nav('home')">
            <div style="display:flex;align-items:center;justify-content:center;">
              ${hexLogoSVG(44)}
            </div>
            <span style="color:var(--text);font-weight:800;font-size:18px;font-family:var(--font-display);letter-spacing:4px;">KOMPSIA</span>
          </div>
          <p style="color:var(--muted);font-size:13px;line-height:1.85;">${t('footer_tagline')}</p>
        </div>
        ${col(t('footer_shop'),shopLinks)}
        ${col(t('footer_company'),companyLinks)}
        ${col(t('footer_support'),supportLinks)}
      </div>
      <div style="border-top:1px solid var(--border);padding-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
        <span style="color:var(--muted);font-size:12px;">© 2026 KOMPSIA · Dubai, UAE · TRN 123456789012345</span>
        <div style="display:flex;gap:16px;">
          ${["Visa","Mastercard","Amex","Apple Pay","Google Pay"].map(p=>`<span style="color:var(--muted);font-size:11px;opacity:0.7;">${p}</span>`).join("")}
        </div>
      </div>
    </div>
  </footer>`;
}
/* ============================= MAIN RENDER ============================= */
function pageHTML(){
  switch(state.page){
    case "home": return homePageHTML();
    case "catalog": return catalogPageHTML();
    case "product": return productPageHTML();
    case "checkout": case "confirmed": return checkoutPageHTML();
    case "orders": return ordersPageHTML();
    case "admin": return adminPanelHTML();
    case "policy": return policyPageHTML();
    case "about": return aboutPageHTML();
    case "faq": return faqPageHTML();
    case "sizeguide": return sizeGuidePageHTML();
    case "feedback": return feedbackPageHTML();
    case "favourites": return favouritesPageHTML();
    case "wallet": return walletPageHTML();
    case "notifications": return notificationsPageHTML();
    case "profile": return profilePageHTML();
    default: return homePageHTML();
  }
}

  if(state.page==="admin" || state.cartOpen || state.loginOpen) return "";
  const num = siteContent.contact.whatsapp.replace(/[^\d]/g,"");
  return `
  <a href="https://wa.me/${num}" target="_blank" rel="noopener noreferrer" title="Chat with us on WhatsApp"
     style="position:fixed;bottom:26px;left:26px;z-index:900;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,0.35);transition:transform .2s ease;"
     onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.36a9.9 9.9 0 0 0 4.62 1.15h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.64-1.03-5.13-2.9-6.99A9.82 9.82 0 0 0 12.04 2zm0 18.06h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.29c0-4.53 3.69-8.22 8.26-8.22 2.2 0 4.28.86 5.84 2.42a8.16 8.16 0 0 1 2.41 5.81c0 4.53-3.7 8.14-8.26 8.14zm4.52-6.13c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.15.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23a7.5 7.5 0 0 1-1.38-1.72c-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.42.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.08 0 1.23.89 2.41 1.02 2.58.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.08.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>
  </a>`;
}
function render(){
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  let selStart = null, selEnd = null;
  if(active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")){
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){}
  }

  // Only play the open animation on the transition from closed -> open,
  // never on a re-render that happens while the panel is already open
  // (this is what caused the drawer/modal to "flicker" on qty changes).
  const cartAnimate = state.cartOpen && !_prevCartOpen;
  const loginAnimate = state.loginOpen && !_prevLoginOpen;

  const app = document.getElementById("app");
  app.innerHTML = `
    ${bannerHTML()}
    ${navbarHTML()}
    ${categoryLauncherHTML()}
    <main>${pageHTML()}</main>
    ${state.page!=="admin" ? footerHTML() : ""}
    ${whatsappButtonHTML()}
    ${siteDrawerHTML()}
    ${cartDrawerHTML(cartAnimate)}
    ${loginModalHTML(loginAnimate)}
    ${googleChooserHTML()}
  `;

  _prevCartOpen = state.cartOpen;
  _prevLoginOpen = state.loginOpen;

  const lockScroll = state.cartOpen || state.loginOpen || state.googleChooserOpen || state.siteMenuOpen;
  document.body.style.overflow = lockScroll ? "hidden" : "";
  document.documentElement.style.overflow = lockScroll ? "hidden" : "";

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ============================= INIT ============================= */
window.addEventListener("scroll", () => {
  const navEl = document.querySelector("nav.navbar");
  if(navEl){
    navEl.style.boxShadow = window.scrollY > 10 ? "0 2px 16px var(--shadow)" : "none";
  }
});
document.addEventListener("click", (e) => {
  let changed = false;
  if(state.userMenuOpen && !e.target.closest(".user-dropdown-trigger") && !e.target.closest(".user-dropdown-menu")){
    state.userMenuOpen = false; changed = true;
  }
  if(state.langMenuOpen && !e.target.closest(".lang-dropdown-trigger") && !e.target.closest(".lang-dropdown-menu")){
    state.langMenuOpen = false; changed = true;
  }
  if(state.categoryMenuOpen && !e.target.closest(".category-launcher") && !e.target.closest(".category-mega-menu")){
    state.categoryMenuOpen = false; changed = true;
  }
  if(changed) render();
});

loadTheme();
loadCMS();
loadFavourites();
loadAccounts();
loadCart();
loadLanguage();
if(location.hash){ applyRoute(location.hash); } else { render(); }
void initBackend();
</script>
</body>
